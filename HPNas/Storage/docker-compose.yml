---
name: storage

services:
  Gitlab:
    image: gitlab/gitlab-ce:19.2.1-ce.0
    container_name: GitLab
    volumes:
      - /mnt/USB3.0-1TB/GitLab/config:/etc/gitlab
      - /mnt/USB3.0-1TB/GitLab/logs:/var/log/gitlab
      - /mnt/USB3.0-1TB/GitLab/data:/var/opt/gitlab
    ports:
      - '0.0.0.0:1022:22'
      - '0.0.0.0:1080:80'
      - '0.0.0.0:1443:1443'
    restart: unless-stopped
    stdin_open: true
    tty: true

  samba:
    image: dperson/samba:amd64
    container_name: samba
    environment:
      - PUID=1000
      - PGID=1000
      - SAMBA_USER=${SAMBA_USER}
      - SAMBA_PASSWORD=${SAMBA_PASSWORD}
    volumes:
      - /mnt/USB3.0-1TB/Storage:/Storage
      - /mnt/USB3.0-1TB/Courses:/Courses
      - /mnt/MediaStorage/Books:/Books
      - /mnt/MediaStorage/AudioBooks:/AudioBooks
    network_mode: host
    command: >
      -u "${SAMBA_USER};${SAMBA_PASSWORD}"
      -s "Storage;/Storage;yes;no;no;${SAMBA_USER}"
      -s "Courses;/Courses;yes;no;no;${SAMBA_USER}"
      -s "Books;/Books;yes;no;no;${SAMBA_USER}"
      -s "AudioBooks;/AudioBooks;yes;no;no;${SAMBA_USER}"
    restart: unless-stopped
    stdin_open: true
    tty: true
