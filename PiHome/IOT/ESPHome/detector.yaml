# base_detector.yaml
esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  area: ${device_area}

esp8266:
  board: nodemcuv2
  early_pin_init: false

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

binary_sensor:
  - platform: template
    name: Ambient Light Saturated
    entity_category: diagnostic
    lambda: |-
      const float voltage = id(ldr_voltage).state;
      if (!std::isfinite(voltage)) return {};
      return voltage >= 3.29f;

  - platform: gpio
    id: pir_motion
    name: Motion
    device_class: occupancy
    pin:
      number: GPIO14 # WEMO NodeMCU D5
      mode:
        input: true
    filters:
      # Log the AM312 input before the occupancy hold delays OFF events.
      - lambda: |-
          ESP_LOGD("pir_raw", "AM312 GPIO14 (D5): %s", x ? "HIGH" : "LOW");
          return x;
      - delayed_off: 3min

sensor:
  - platform: adc
    pin: A0
    id: ldr_voltage
    internal: true
    update_interval: 1s
    filters:
      - median:
          window_size: 5
          send_every: 5
          send_first_at: 1
      - multiply: 3.3

  - platform: template
    name: Ambient Light
    device_class: illuminance
    state_class: measurement
    unit_of_measurement: lx
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      const float voltage = id(ldr_voltage).state;
      if (!std::isfinite(voltage) || voltage < 0.0f) return NAN;
      if (voltage <= 0.01f) return 0.0f;
      // NORPS-12 to +3V3, 10k to GND. Cap the estimate at the ADC rail.
      const float bounded_voltage = fminf(voltage, 3.29f);
      const float ldr_resistance_kohm = 10.0f * ((3.3f / bounded_voltage) - 1.0f);
      // Typical graph fit: R ~= 45 kohm * footcandles^-0.825.
      // Approximate; extrapolated above the plotted 100 footcandles.
      return 10.76f * powf(45.0f / ldr_resistance_kohm, 1.0f / 0.825f);
