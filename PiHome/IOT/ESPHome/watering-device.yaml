substitutions:
  device_name: watering-device
  friendly_name: Outdoor Watering System

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  area: Balcony

esp8266:
  board: nodemcuv2
  # Avoid relay transitions as early as possible while the ESP8266 starts.
  early_pin_init: false

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

switch:
  - platform: gpio
    id: watering_zone_1_relay
    name: Strawberry Plant
    pin:
      number: GPIO5 # NodeMCU D1
      inverted: true # Typical relay modules are active-low
    restore_mode: ALWAYS_OFF

  - platform: gpio
    id: watering_zone_2_relay
    name: Tomato Plant
    pin:
      number: GPIO4 # NodeMCU D2
      inverted: true # Typical relay modules are active-low
    restore_mode: ALWAYS_OFF

sensor:
  # Assumes an LDR from 3.3 V to A0 and a 10 kOhm resistor from A0 to GND.
  # NodeMCU boards divide the external A0 voltage down for the ESP8266 ADC.
  - platform: adc
    pin: A0
    id: ldr_voltage
    internal: true
    update_interval: 60s
    filters:
      - median:
          window_size: 5
          send_every: 5
          send_first_at: 1
      - multiply: 3.3

  - platform: template
    name: Ambient Light
    device_class: illuminance
    state_class: measurement
    unit_of_measurement: lx
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      const float voltage = id(ldr_voltage).state;
      if (isnan(voltage) || voltage <= 0.01f || voltage >= 3.29f) {
        return NAN;
      }
      const float ldr_resistance_kohm = 10.0f * ((3.3f / voltage) - 1.0f);
      return 500.0f / powf(ldr_resistance_kohm, 1.4f);
