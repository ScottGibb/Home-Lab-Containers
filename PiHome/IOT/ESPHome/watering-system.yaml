substitutions:
  device_name: watering-device
  friendly_name: Plants Watering System

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  area: Balcony

esp8266:
  board: nodemcuv2
  early_pin_init: false

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

one_wire:
  - platform: gpio
    id: balcony_one_wire
    pin: GPIO2 # NodeMCU D4 — DS18B20 data; 4.7 kΩ pull-up to 3.3 V
    # Power the DS18B20 from 3.3 V and GND.

switch:
  - platform: gpio
    id: watering_zone_1_relay
    name: Strawberry Plant
    pin:
      number: GPIO5 # NodeMCU D1
      inverted: true
    restore_mode: ALWAYS_OFF

  - platform: gpio
    id: watering_zone_2_relay
    name: Tomato Plant
    pin:
      number: GPIO4 # NodeMCU D2
      inverted: true
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: gpio
    id: indoor_plant_motion
    name: Indoor Plant Motion
    device_class: occupancy
    pin:
      number: GPIO14 # NodeMCU D5
      mode:
        input: true
    filters:
      - delayed_off: 3min

output:
  - platform: gpio
    id: mux_select_a
    pin: GPIO12 # NodeMCU D6 — CD74HC4051 address line A
  - platform: gpio
    id: mux_select_b
    pin: GPIO13 # NodeMCU D7 — CD74HC4051 address line B (move B from GND; C stays tied to GND)

globals:
  - id: g_ldr_voltage
    type: float
    restore_value: false
    initial_value: "0.0"
  - id: g_moisture_voltage
    type: float
    restore_value: false
    initial_value: "0.0"
  - id: g_balcony_ldr_voltage
    type: float
    restore_value: false
    initial_value: "0.0"

interval:
  - interval: 500ms
    then:
      # Switch to Channel Y0 (LDR)
      - output.turn_off: mux_select_a
      - output.turn_off: mux_select_b
      - delay: 50ms
      - component.update: mux_adc
      - lambda: id(g_ldr_voltage) = id(mux_adc).state;

      # Switch to Channel Y1 (Soil Moisture)
      - output.turn_on: mux_select_a
      - output.turn_off: mux_select_b
      - delay: 50ms
      - component.update: mux_adc
      - lambda: id(g_moisture_voltage) = id(mux_adc).state;

      # Switch to Channel Y2 (Balcony LDR): A low, B high, C grounded
      - output.turn_off: mux_select_a
      - output.turn_on: mux_select_b
      - delay: 50ms
      - component.update: mux_adc
      - lambda: id(g_balcony_ldr_voltage) = id(mux_adc).state;

sensor:
  - platform: dallas_temp
    id: balcony_temperature
    name: Balcony Temperature
    one_wire_id: balcony_one_wire
    # Auto-detect the single DS18B20 connected to this bus.
    update_interval: 30s

  - platform: adc
    id: mux_adc
    pin: A0
    update_interval: never # only sampled on-demand from the interval above
    filters:
      - multiply: 3.3

  - platform: template
    name: Indoor Plant Light
    device_class: illuminance
    state_class: measurement
    unit_of_measurement: lx
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      const float voltage = id(g_ldr_voltage);
      if (isnan(voltage) || voltage <= 0.01f || voltage >= 3.29f) {
        return NAN;
      }
      const float ldr_resistance_kohm = 10.0f * ((3.3f / voltage) - 1.0f);
      return 500.0f / powf(ldr_resistance_kohm, 1.4f);

  - platform: template
    name: Balcony Light
    device_class: illuminance
    state_class: measurement
    unit_of_measurement: lx
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      const float voltage = id(g_balcony_ldr_voltage);
      if (isnan(voltage) || voltage <= 0.01f || voltage >= 3.29f) {
        return NAN;
      }
      const float ldr_resistance_kohm = 10.0f * ((3.3f / voltage) - 1.0f);
      return 500.0f / powf(ldr_resistance_kohm, 1.4f);

  - platform: template
    name: Indoor Plant Moisture
    device_class: moisture
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return id(g_moisture_voltage);
    filters:
      - calibrate_linear:
          - 0.28 -> 0 # Dry voltage -> 0%
          - 2.34 -> 100 # Wet voltage -> 100%
      - clamp:
          min_value: 0
          max_value: 100
