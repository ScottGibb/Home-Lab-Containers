substitutions:
  device_name: watering-device
  friendly_name: Plants Watering System

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  area: Balcony

esp8266:
  board: nodemcuv2
  early_pin_init: false

logger:
  # Disabling serial logger so TX (GPIO1) and RX (GPIO3) can be used for the water sensor
  baud_rate: 0

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

one_wire:
  - platform: gpio
    id: balcony_one_wire
    pin: GPIO14 # NodeMCU D5 (TEMP pin in schematic)

switch:
  - platform: gpio
    id: relay_strawberry
    name: Strawberry Plant Relay (Pump 0)
    pin:
      number: GPIO4 # NodeMCU D2 (PUMP_0)
      inverted: true
    restore_mode: ALWAYS_OFF

  - platform: gpio
    id: relay_tomato
    name: Tomato Plant Relay (Pump 1)
    pin:
      number: GPIO2 # NodeMCU D4 (PUMP_1)
      inverted: true
    restore_mode: ALWAYS_OFF

binary_sensor:
  - platform: gpio
    id: pir_living_room
    name: Living Room Motion Sensor
    device_class: motion
    pin:
      number: GPIO16 # NodeMCU D0 (PIR_0)
      mode:
        input: true
    filters:
      - delayed_off: 3min

  # - platform: gpio
  #   id: pir_balcony
  #   name: Balcony Motion Sensor
  #   device_class: motion
  #   pin:
  #     number: GPIO5 # NodeMCU D1 (PIR_1)
  #     mode:
  #       input: true
  #   filters:
  #     - delayed_off: 3min

output:
  # CD74HC4051 8-channel analog mux select lines (ADC_S0, ADC_S1, ADC_S2)
  - platform: gpio
    id: mux_select_a
    pin: GPIO12 # NodeMCU 6 (ADC_S0)
  - platform: gpio
    id: mux_select_b
    pin: GPIO13 # NodeMCU D7 (ADC_S1)
  - platform: gpio
    id: mux_select_c
    pin: GPIO15 # NodeMCU D8 (ADC_S2)

globals:
  - id: g_soil_indoor_voltage
    type: float
    restore_value: false
    initial_value: "0.0"
  - id: g_living_room_light_voltage
    type: float
    restore_value: false
    initial_value: "0.0"
  - id: g_light_balcony_voltage
    type: float
    restore_value: false
    initial_value: "0.0"
  - id: g_soil_cap_1_voltage
    type: float
    restore_value: false
    initial_value: "0.0"
  - id: g_soil_cap_2_voltage
    type: float
    restore_value: false
    initial_value: "0.0"
  - id: g_soil_cap_3_voltage
    type: float
    restore_value: false
    initial_value: "0.0"
  - id: g_soil_cap_4_voltage
    type: float
    restore_value: false
    initial_value: "0.0"

interval:
  - interval: 1s
    then:
      # Y0 — Light Indoor (A=0 B=0 C=0)
      - output.turn_off: mux_select_a
      - output.turn_off: mux_select_b
      - output.turn_off: mux_select_c
      - delay: 50ms
      - component.update: mux_adc
      - lambda: id(g_living_room_light_voltage) = id(mux_adc).state;

      # Y1 — Light Balcony (A=1 B=0 C=0)
      - output.turn_on: mux_select_a
      - output.turn_off: mux_select_b
      - output.turn_off: mux_select_c
      - delay: 50ms
      - component.update: mux_adc
      - lambda: id(g_light_balcony_voltage) = id(mux_adc).state;

      # Y2 — Resistive Soil Indoor  (A=0 B=1 C=0)
      - output.turn_off: mux_select_a
      - output.turn_on: mux_select_b
      - output.turn_off: mux_select_c
      - delay: 50ms
      - component.update: mux_adc
      - lambda: id(g_soil_indoor_voltage) = id(mux_adc).state;

      # Y3 — Soil Capacitive 1 (A=1 B=1 C=0)
      - output.turn_on: mux_select_a
      - output.turn_on: mux_select_b
      - output.turn_off: mux_select_c
      - delay: 50ms
      - component.update: mux_adc
      - lambda: id(g_soil_cap_1_voltage) = id(mux_adc).state;

      # Y4 — Soil Capacitive 2 (A=0 B=0 C=1)
      - output.turn_off: mux_select_a
      - output.turn_off: mux_select_b
      - output.turn_on: mux_select_c
      - delay: 50ms
      - component.update: mux_adc
      - lambda: id(g_soil_cap_2_voltage) = id(mux_adc).state;

      # Y5 — Soil Capacitive 3 (A=1 B=0 C=1)
      - output.turn_on: mux_select_a
      - output.turn_off: mux_select_b
      - output.turn_on: mux_select_c
      - delay: 50ms
      - component.update: mux_adc
      - lambda: id(g_soil_cap_3_voltage) = id(mux_adc).state;

      # Y6 — Soil Capacitive 4 (A=0 B=1 C=1)
      - output.turn_off: mux_select_a
      - output.turn_on: mux_select_b
      - output.turn_on: mux_select_c
      - delay: 50ms
      - component.update: mux_adc
      - lambda: id(g_soil_cap_4_voltage) = id(mux_adc).state;

      # Print all raw voltage readings directly to logger
      - lambda: |-
          ESP_LOGI("raw_adc", "Soil Indoor: %.3fV | Light Indoor: %.3fV | Light Balcony: %.3fV",
            id(g_soil_indoor_voltage), id(g_living_room_light_voltage), id(g_light_balcony_voltage));
          ESP_LOGI("raw_adc", "Cap Soil 1: %.3fV | Cap Soil 2: %.3fV | Cap Soil 3: %.3fV | Cap Soil 4: %.3fV",
            id(g_soil_cap_1_voltage), id(g_soil_cap_2_voltage), id(g_soil_cap_3_voltage), id(g_soil_cap_4_voltage));

sensor:
  - platform: dallas_temp
    id: temp_balcony
    name: Balcony Temperature
    one_wire_id: balcony_one_wire
    update_interval: 30s

  - platform: ultrasonic
    trigger_pin: GPIO0 # TX (WATER_LEVEL_TRIGGER)
    echo_pin: GPIO5 # RX (WATER_LEVEL_RECEIVE)
    name: Water Level Distance
    update_interval: 1s
    pulse_time: 10us
    timeout: 5m

  - platform: adc
    id: mux_adc
    pin: A0
    update_interval: never
    filters:
      - multiply: 3.3

  # --- Processed Sensors ---
  - platform: template
    id: living_room_light
    name: Living Room Light
    device_class: illuminance
    state_class: measurement
    unit_of_measurement: lx
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      const float voltage = id(g_living_room_light_voltage);
      if (isnan(voltage) || voltage <= 0.01f || voltage >= 3.29f) {
        return NAN;
      }
      const float ldr_resistance_kohm = 10.0f * ((3.3f / voltage) - 1.0f);
      return 500.0f / powf(ldr_resistance_kohm, 1.4f);

  - platform: template
    id: light_balcony
    name: Balcony Light
    device_class: illuminance
    state_class: measurement
    unit_of_measurement: lx
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      const float voltage = id(g_light_balcony_voltage);
      if (isnan(voltage) || voltage <= 0.01f || voltage >= 3.29f) {
        return NAN;
      }
      const float ldr_resistance_kohm = 10.0f * ((3.3f / voltage) - 1.0f);
      return 500.0f / powf(ldr_resistance_kohm, 1.4f);

  - platform: template
    id: soil_indoor
    name: Indoor Soil Moisture
    device_class: moisture
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return id(g_soil_indoor_voltage);
    filters:
      - calibrate_linear:
          - 0.28 -> 0
          - 2.34 -> 100
      - clamp:
          min_value: 0
          max_value: 100

  - platform: template
    id: soil_cap_1
    name: Capacitive Soil 1
    device_class: moisture
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return id(g_soil_cap_1_voltage);
    filters:
      - calibrate_linear:
          - 2.1 -> 0
          - 1.20 -> 100
      - clamp:
          min_value: 0
          max_value: 100

  - platform: template
    id: soil_cap_2
    name: Capacitive Soil 2
    device_class: moisture
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return id(g_soil_cap_2_voltage);
    filters:
      - calibrate_linear:
          - 2.1 -> 0
          - 1.20 -> 100
      - clamp:
          min_value: 0
          max_value: 100

  - platform: template
    id: soil_cap_3
    name: Capacitive Soil 3
    device_class: moisture
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return id(g_soil_cap_3_voltage);
    filters:
      - calibrate_linear:
          - 2.1 -> 0
          - 1.20 -> 100
      - clamp:
          min_value: 0
          max_value: 100

  - platform: template
    id: soil_cap_4
    name: Capacitive Soil 4
    device_class: moisture
    state_class: measurement
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 30s
    lambda: return id(g_soil_cap_4_voltage);
    filters:
      - calibrate_linear:
          - 2.1 -> 0
          - 1.20 -> 100
      - clamp:
          min_value: 0
          max_value: 100

  # --- Raw Mux Voltage Sensors ---
  - platform: template
    id: raw_voltage_soil_indoor
    name: Raw Voltage Soil Indoor
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    update_interval: 1s
    lambda: return id(g_soil_indoor_voltage);

  - platform: template
    id: raw_voltage_living_room_light
    name: Raw Voltage Light Indoor
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    update_interval: 1s
    lambda: return id(g_living_room_light_voltage);

  - platform: template
    id: raw_voltage_light_balcony
    name: Raw Voltage Light Balcony
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    update_interval: 1s
    lambda: return id(g_light_balcony_voltage);

  - platform: template
    id: raw_voltage_soil_cap_1
    name: Raw Voltage Capacitive Soil 1
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    update_interval: 1s
    lambda: return id(g_soil_cap_1_voltage);

  - platform: template
    id: raw_voltage_soil_cap_2
    name: Raw Voltage Capacitive Soil 2
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    update_interval: 1s
    lambda: return id(g_soil_cap_2_voltage);

  - platform: template
    id: raw_voltage_soil_cap_3
    name: Raw Voltage Capacitive Soil 3
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    update_interval: 1s
    lambda: return id(g_soil_cap_3_voltage);

  - platform: template
    id: raw_voltage_soil_cap_4
    name: Raw Voltage Capacitive Soil 4
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    update_interval: 1s
    lambda: return id(g_soil_cap_4_voltage);
